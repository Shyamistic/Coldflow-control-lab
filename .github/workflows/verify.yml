name: Verify software demonstrator
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: g++ -std=c++17 -Wall -Wextra -Werror firmware/tests/safety_test.cpp -o /tmp/coldflow-safety && /tmp/coldflow-safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labeled-simulation-captures
          path: artifacts/browser
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: pio run --project-dir firmware