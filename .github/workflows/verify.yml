name: Verify software demonstrator
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: mkdir -p artifacts
      - run: npm sbom --sbom-format=cyclonedx > artifacts/sbom.json
      - run: node scripts/check-sbom.mjs artifacts/sbom.json
      - run: docker build -t coldflow-simulation:${{ github.sha }} .
      - id: image
        run: echo "image_id=$(docker image inspect --format '{{.Id}}' coldflow-simulation:${{ github.sha }})" >> "$GITHUB_OUTPUT"
      - run: node scripts/write-sbom-metadata.mjs artifacts/sbom.json artifacts/sbom-metadata.json coldflow-simulation:${{ github.sha }} "${{ steps.image.outputs.image_id }}"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node --experimental-strip-types --test tests/hil.test.mjs tests/contracts.test.ts tests/domain.test.ts
      - run: g++ -std=c++17 -Wall -Wextra -Werror firmware/tests/safety_test.cpp -o /tmp/coldflow-safety && /tmp/coldflow-safety
      - run: g++ -std=c++17 -Wall -Wextra -Werror firmware/tests/hal_test.cpp -o /tmp/coldflow-hal && /tmp/coldflow-hal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-evidence-${{ github.sha }}
          path: artifacts
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: pio run --project-dir firmware